# secure-perimeter telework profile - generated by provision-peer.sh
# linux:   sudo wg-quick up <name>     (copy to /etc/wireguard/<name>.conf first)
# desktop: import into the WireGuard app; mobile: scan the QR at provision time
[Interface]
PrivateKey = __CLIENT_PRIVATE_KEY__
Address = __CLIENT_ADDRESS__/32
DNS = 10.99.0.1

[Peer]
PublicKey = __SERVER_PUBLIC_KEY__
PresharedKey = __PRESHARED_KEY__
Endpoint = __ENDPOINT__
AllowedIPs = 10.10.10.0/24, 10.20.20.0/24
PersistentKeepalive = 25
